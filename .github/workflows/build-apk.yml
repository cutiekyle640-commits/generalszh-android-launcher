name: Build ZH Port Remake APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Accept Android SDK licenses using the SDK already on ubuntu-latest
      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Bootstrap gradlew from scratch — no binary needed in repo
      - name: Bootstrap Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZHPortRemake-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ZH Port Remake by cutiekyle._. — v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## GeneralsZH Port Remake by cutiekyle._.
            Native Android app built with Kotlin + Jetpack Compose.

            ### How to install
            1. Download **app-debug.apk** below
            2. On your Android: Settings → Security → enable **Install unknown apps**
            3. Open the APK file and tap Install

            ### What's inside
            - **Launch** — mod load order, launch command generator
            - **Mods** — add/edit/delete, toggles, compatibility matrix
            - **Graphics** — Vulkan/OpenGL ES renderer, resolution, quality
            - **Performance** — CPU governor, FPS cap, heap limit, VSync
            - **Controls** — touch gesture toggles, sensitivity sliders
            - **Network** — GeneralsOnline, STUN/TURN, bandwidth
            - **Profiles** — quick-apply saved configs
            - **Logs** — live log with level filter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
