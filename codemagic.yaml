workflows:
  android-debug:
    name: ZH Port Remake - Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17
      android_signing:
        - keystore_reference
      groups:
        - android_credentials

    scripts:
      - name: Set up Gradle wrapper
        script: |
          brew install gradle || true
          gradle wrapper --gradle-version=8.4 --distribution-type=bin
          chmod +x gradlew

      - name: Set Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ANDROID_HOME is: $ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/cmdline-tools/ || true

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - cutiekyle640@gmail.com
        notify:
          success: true
          failure: true
